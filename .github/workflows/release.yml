name: Docs & Release

on:
  push:
    branches:
      - main
      - support/*

permissions:
  contents: write          # required by the release action
  id-token: write          # required for npm trusted publishing (OIDC)

jobs:
  # reuse the unchanged build job
  build:
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit

  deploy-docs:
    if: github.ref_name == 'main'
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:docs

      - name: Deploy docs to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          if [[ "${{ github.ref_name }}" == main ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
            echo "tag=v${MAJOR}-latest" >> "$GITHUB_OUTPUT"
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.get_version.outputs.version }}"
          name: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          makeLatest: ${{ steps.dist_tag.outputs.is_main }}

      - name: Publish package to npm (OIDC)
        run: npm publish --tag ${{ steps.dist_tag.outputs.tag }}